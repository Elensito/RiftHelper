<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  }
  .overlay-card {
    position: absolute;
    right: 0; top: 0;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 20px 12px 14px;
    border-radius: 14px;
    background: linear-gradient(135deg, rgba(10, 8, 22, 0.95) 0%, rgba(15, 12, 30, 0.92) 100%);
    border: 1px solid rgba(0, 229, 255, 0.4);
    backdrop-filter: blur(20px);
    box-shadow:
      0 0 24px rgba(0, 229, 255, 0.25),
      0 0 48px rgba(120, 90, 255, 0.12),
      inset 0 1px 0 rgba(255, 255, 255, 0.05),
      0 8px 24px rgba(0, 0, 0, 0.6);
    animation: slideIn 0.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    opacity: 0;
    transform: translateX(30px);
  }
  @keyframes slideIn {
    to { opacity: 1; transform: translateX(0); }
  }
  .overlay-icon {
    width: 38px; height: 38px;
    object-fit: contain;
    border-radius: 10px;
    padding: 3px;
    background: linear-gradient(135deg, rgba(120, 90, 255, 0.2), rgba(0, 229, 255, 0.15));
    border: 1px solid rgba(120, 90, 255, 0.35);
    filter: drop-shadow(0 0 8px rgba(120, 90, 255, 0.5));
    flex-shrink: 0;
  }
  .overlay-text {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .overlay-title {
    font-size: 13px;
    font-weight: 700;
    color: #ff4757;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    line-height: 1;
    text-shadow: 0 0 14px rgba(255, 71, 87, 0.6);
    animation: pulse 1.5s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.6; }
  }
  .overlay-sub {
    font-size: 11px;
    font-weight: 500;
    color: #00e5ff;
    letter-spacing: 0.04em;
    line-height: 1;
  }
  .rec-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: #ff4757;
    box-shadow: 0 0 10px rgba(255, 71, 87, 0.7);
    animation: blink 1s ease-in-out infinite;
    flex-shrink: 0;
    margin-left: 4px;
  }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }
</style>
</head>
<body>
<div class="overlay-card" id="card">
  <img src="ai_coach.png" alt="" class="overlay-icon" draggable="false" />
  <div class="overlay-text">
    <span class="overlay-title" id="title">RECORDING</span>
    <span class="overlay-sub">Rift Timeline</span>
  </div>
  <span class="rec-dot"></span>
</div>
</body>
</html>

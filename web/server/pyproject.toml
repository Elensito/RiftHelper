[tool.poetry]
name = "rifthelper-web-server"
version = "0.1.0"
description = "Backend FastAPI de la web RiftHelper: API de partidas de League of Legends y assets"
authors = ["RiftHelper"]
packages = [{ include = "rifthelper" }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.141.1"
uvicorn = "^0.52.1"
python-dotenv = ">=1.0.0"
aiohttp = ">=3.9.0"

[tool.poetry.scripts]
rifthelper-web = "rifthelper.server.app:main"
rifthelper-crawl = "rifthelper.services.crawler:main_cli"
rifthelper-incremental = "rifthelper.services.crawler:main_incremental_cli"
rifthelper-aggregate = "rifthelper.services.aggregator:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

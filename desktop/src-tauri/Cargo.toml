[package]
name = "rifthelper-desktop"
version = "1.1.1"
description = "RiftHelper desktop app"
authors = ["RiftHelper"]
edition = "2021"

[lib]
name = "rifthelper_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Explicit bin targets so Tauri unambiguously treats the GUI app (main.rs) as
# the main/installed binary and never the console-only OBS probe helper.
[[bin]]
name = "rifthelper-desktop"
path = "src/main.rs"

[[bin]]
name = "obs_probe"
path = "src/bin/obs_probe.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-notification = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "blocking"] }
opener = "0.6"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
libobs-simple = "8.0.1"
libobs-bootstrapper = "0.2"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
libobs-wrapper = "9.0.4"
libobs = "5"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "implement",
  "Win32_Devices_FunctionDiscovery",
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_Media_Audio",
  "Win32_Media_MediaFoundation",
  "Win32_Media_Multimedia",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_IO",
  "Win32_System_Pipes",
  "Win32_System_Threading",
  "Win32_Storage_FileSystem",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.58"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

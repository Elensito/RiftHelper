name: Build Windows App

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install web dependencies
        working-directory: web
        run: npm install

      - name: Build web frontend
        working-directory: web
        run: npm run build

      - name: Stage frontend into desktop/dist
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force desktop/dist -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force desktop/dist | Out-Null
          Copy-Item -Recurse -Force web/dist/* desktop/dist/

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install

      - name: Build and Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: ${{ github.ref_name }}
          releaseName: "RiftHelper ${{ github.ref_name }}"
          releaseBody: "Nueva version de RiftHelper para Windows."
          releaseDraft: false
          prerelease: false
          uploadPlainBinary: false
          includeUpdaterJson: false

      - name: Install WinApp CLI
        shell: pwsh
        run: winget install microsoft.winappcli --silent --accept-package-agreements --accept-source-agreements

      - name: Generate MSIX dev certificate
        shell: pwsh
        working-directory: desktop/msix
        run: winapp cert generate --if-exists skip

      - name: Pack MSIX
        shell: pwsh
        working-directory: desktop/msix
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item ../src-tauri/target/release/rifthelper-desktop.exe dist/RiftHelper.exe
          winapp pack dist --cert devcert.pfx

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: RiftHelper-MSIX
          path: desktop/msix/*.msix

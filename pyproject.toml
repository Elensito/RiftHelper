[tool.poetry]
name = "rifthelper"
version = "0.1.0"
description = "Bot de Discord para verificar cuentas de League of Legends (EUW) y mostrar rango y LP"
authors = ["RiftHelper"]
packages = [{ include = "rifthelper" }]

[tool.poetry.dependencies]
python = "^3.11"
discord-py = ">=2.3.2"
python-dotenv = ">=1.0.0"
aiohttp = ">=3.9.0"
openpyxl = "^3.1.5"
pillow = "^12.3.0"
fastapi = "^0.141.1"
uvicorn = "^0.52.1"

[tool.poetry.scripts]
rifthelper = "rifthelper.main:main"
rifthelper-web = "rifthelper.server.app:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
